name: GitVersion

on:
  workflow_dispatch:

jobs:
  gitversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'
      - uses: gittools/actions/gitversion/execute@v4
